name: Aggiorna calendario Palermo

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Aggiorna calendario
        run: python update_calendar.py

      - name: Salva eventuali modifiche
        run: |
          git config user.name "palermo-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add palermo.ics
          if git diff --cached --quiet; then
            echo "Nessuna modifica"
          else
            git commit -m "Aggiorna calendario Palermo"
            git push
          fi
